AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  DevFix Infrastructure Template

Globals:
  HttpApi:
    CorsConfiguration:
      AllowMethods:
        - POST
        - OPTIONS
      AllowHeaders:
        - Content-Type
      AllowOrigins:
        - "*"

Resources:
  DevFixAnalyzeFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../app/backend/
      Handler: handler.lambda_handler
      Runtime: python3.12
      Architectures:
        - x86_64
      MemorySize: 256
      Timeout: 30
      Environment:
        Variables:
          BEDROCK_MODEL_ID: amazon.nova-lite-v1:0
          BEDROCK_REGION: us-west-2
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: 'arn:aws:bedrock:*::foundation-model/amazon.nova*'
      Events:
        AnalyzeApi:
          Type: HttpApi
          Properties:
            Path: /api/analyze
            Method: POST
        AnalyzeOptionsApi:
          Type: HttpApi
          Properties:
            Path: /api/analyze
            Method: OPTIONS

  DevFixFrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "devfix-frontend-${AWS::AccountId}-${AWS::Region}"
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false

  DevFixFrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DevFixFrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: '*'
            Action: s3:GetObject
            Resource: !Sub "${DevFixFrontendBucket.Arn}/*"

  DevFixCloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Origins:
          - Id: S3Origin
            DomainName: !Sub "${DevFixFrontendBucket}.s3-website-${AWS::Region}.amazonaws.com"
            CustomOriginConfig:
              HTTPPort: 80
              OriginProtocolPolicy: http-only
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          ForwardedValues:
            QueryString: false
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html

Outputs:
  ApiUrl:
    Description: HTTP API URL
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  FrontendBucketName:
    Description: Frontend S3 Bucket Name
    Value: !Ref DevFixFrontendBucket
  CloudFrontDistributionId:
    Description: CloudFront Distribution ID
    Value: !Ref DevFixCloudFrontDistribution
  CloudFrontUrl:
    Description: CloudFront URL
    Value: !Sub "https://${DevFixCloudFrontDistribution.DomainName}"
